
{% extends "base.html" %}

{% block titulo %}Editar contacto | Minions{% endblock %}

{% block contenido %}

<section class="tarjeta">

    <h2>✏️ ¡Vamos a editar un contacto!</h2>

    <form method="POST">

        <label>Nombre:</label>
        <input type="text" name="nombre"
               value="{{ contacto.nombre }}" required>

        <label>Teléfono:</label>
        <input type="text" name="telefono"
               value="{{ contacto.telefono }}" required>

        <label>Correo electrónico:</label>
        <input type="email" name="correo"
               value="{{ contacto.correo or '' }}">

        <label>Categoría:</label>

        <select name="categoria" required>

            {% for categoria in ['Familia', 'Escuela', 'Trabajo', 'Otro'] %}

                <option value="{{ categoria }}"
                    {% if contacto.categoria == categoria %}selected{% endif %}>
                    {{ categoria }}
                </option>

            {% endfor %}

        </select>

        <button type="submit" class="boton-agregar">
            💛 Guardar cambios
        </button>

        <a href="{{ url_for('inicio') }}" class="boton-volver">
            Volver a la agenda
        </a>

    </form>

</section>

{% endblock %}
